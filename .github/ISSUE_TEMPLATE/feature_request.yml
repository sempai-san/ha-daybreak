name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please describe the problem first, then the idea. One request per issue.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do and what is in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could DayBreak solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: dropdown
    id: part
    attributes:
      label: Area
      options: [Light, Audio, Notification, Climate, Calendar, Schedule, History, Panel / UI, Other]
    validations:
      required: true
